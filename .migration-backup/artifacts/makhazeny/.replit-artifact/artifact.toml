kind = "web"
previewPath = "/"
title = "Makhazeny Warehouse"
version = "1.0.0"
id = "artifacts/makhazeny"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25085

[services.development]
run = "pnpm --filter @workspace/makhazeny run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/makhazeny", "run", "build" ]
publicDir = "artifacts/makhazeny/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25085"
BASE_PATH = "/"
